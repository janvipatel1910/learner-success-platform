[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "skillpulse-backend"
version = "0.1.0"
description = "FastAPI backend for SkillPulse Learner Success OS"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Janvi Patel" }
]
dependencies = [
  "alembic>=1.19,<2.0",
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary,pool]>=3.3,<4.0",
  "PyJWT[crypto]>=2.13,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["skillpulse*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests/backend"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
markers = [
  "integration: tests that require PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
