<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillPulse course certificate</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #eef2f8;
      color: #17243b;
      font-family: system-ui, sans-serif;
    }

    .page { max-width: 900px; margin: auto; }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    a { color: #3455db; }

    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 8px;
      background: #3455db;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .certificate {
      padding: 64px 48px;
      border: 8px double #c9a94a;
      background: white;
      text-align: center;
      box-shadow: 0 12px 40px rgb(23 36 59 / 12%);
    }

    .brand {
      color: #3455db;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .eyebrow {
      margin-top: 42px;
      color: #9a7420;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 30px;
      font-family: Georgia, serif;
      font-size: 38px;
    }

    .recipient { margin: 8px 0; color: #58677d; }

    .name {
      margin: 8px 0 24px;
      font-family: Georgia, serif;
      font-size: 34px;
    }

    .award {
      max-width: 650px;
      margin: 18px auto;
      font-size: 23px;
      font-weight: 700;
    }

    .course { color: #58677d; }

    .details {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 28px;
      margin-top: 38px;
      padding-top: 20px;
      border-top: 1px solid #dce4ee;
      font-size: 13px;
    }

    .disclaimer {
      max-width: 650px;
      margin: 30px auto 0;
      color: #58677d;
      font-size: 12px;
    }

    .error { padding: 24px; border-radius: 12px; background: white; }

    @media print {
      body { padding: 0; background: white; }
      .page { max-width: none; }
      .actions { display: none; }
      .certificate { min-height: 180mm; box-shadow: none; }
    }

    @media (max-width: 600px) {
      .certificate { padding: 40px 20px; }
      h1 { font-size: 30px; }
      .name { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="actions">
      <a href="/">Back to SkillPulse</a>
      <button type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>

    <div id="result" aria-live="polite">Checking certificate…</div>
  </main>

  <script>
    "use strict";

    const result = document.getElementById("result");
    const number = new URLSearchParams(window.location.search).get("number");
    const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
    const apiBase = isLocal ? "http://localhost:8000/api/v1" : location.origin + "/api/v1";

    function showError(message) {
      const box = document.createElement("div");
      box.className = "error";
      box.textContent = message;
      result.replaceChildren(box);
    }

    async function loadCertificate() {
      if (!number) {
        showError("Certificate number is missing from the link.");
        return;
      }

      try {
        const response = await fetch(
          apiBase + "/catalog/certificates/" +
          encodeURIComponent(number) + "/verify"
        );

        if (!response.ok) {
          throw new Error("Certificate could not be verified.");
        }

        const certificate = await response.json();
        const card = document.createElement("article");
        card.className = "certificate";

        function add(tag, className, text) {
          const node = document.createElement(tag);
          node.className = className;
          node.textContent = text;
          card.append(node);
        }

        add("div", "brand", "SKILLPULSE");
        add(
          "div",
          "eyebrow",
          certificate.is_valid ? "Verified course completion" : "Certificate revoked"
        );
        add("h1", "", "Certificate of Completion");
        add("p", "recipient", "This certificate is awarded to");
        add("h2", "name", certificate.learner_name);
        add("p", "recipient", "for completing");
        add("p", "award", certificate.certification_name);
        add("p", "course", certificate.course_title);

        const details = document.createElement("div");
        details.className = "details";

        [
          ["Certificate number", certificate.certificate_number],
          ["Date issued", new Date(certificate.issued_at).toLocaleDateString()],
          ["Status", certificate.is_valid ? "Valid" : "Revoked"]
        ].forEach(([label, value]) => {
          const item = document.createElement("div");
          item.textContent = `${label}: ${value}`;
          details.append(item);
        });

        card.append(details);

        add(
          "p",
          "disclaimer",
          "This is a SkillPulse course completion certificate. It is not an AWS certification and does not represent an AWS credential."
        );

        result.replaceChildren(card);
      } catch (error) {
        showError(error.message);
      }
    }

    loadCertificate();
  </script>
</body>
</html>
