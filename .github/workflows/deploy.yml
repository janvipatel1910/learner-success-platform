name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/skillpulse/**"
      - "backend/migrations/**"
      - "backend/Dockerfile"
      - "deploy/**"
      - "alembic.ini"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # lets the workflow request a short-lived AWS session (OIDC)
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never stop a deploy half-way

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::043914965989:role/skillpulse-github-deploy
  FRONTEND_BUCKET: skillpulse-frontend-043914965989
  CLOUDFRONT_DISTRIBUTION_ID: E17UKOIMNOKGRL
  SITE_URL: https://d2aji2q3nf26vx.cloudfront.net

jobs:
  frontend:
    name: Deploy frontend to S3 and CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend files
        run: |
          aws s3 sync frontend "s3://${FRONTEND_BUCKET}" --delete \
            --exclude ".gitkeep" --exclude ".DS_Store"

      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" --query Invalidation.Id --output text

  backend:
    name: Deploy API to EC2 via Systems Manager
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Show OIDC token claims (diagnostic, no secrets)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "iss"):
              print(f"::notice title=OIDC {key}::{claims.get(key)}")
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the backend instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=skillpulse-backend" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::No running skillpulse-backend instance found."
            exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Run deploy script on the server
        run: |
          COMMAND="cd /opt/skillpulse && git fetch --depth 1 origin ${GITHUB_SHA} && git checkout --force FETCH_HEAD && deploy/deploy.sh ${GITHUB_SHA}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"${COMMAND}\"]" \
            --query Command.CommandId --output text)

          for attempt in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "Deploy status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text | tail -40

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Backend deploy finished with status $STATUS"
            exit 1
          fi

  smoke-test:
    name: Smoke test the live site
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 5

    steps:
      - name: Frontend responds
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/")
          echo "Frontend: $code"
          test "$code" = "200"

      - name: API responds through CloudFront
        run: |
          # 401 = request reached FastAPI, which correctly requires sign-in.
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/api/v1/auth/me")
            echo "API: $code"
            [ "$code" = "401" ] && exit 0
            sleep 10
          done
          exit 1
