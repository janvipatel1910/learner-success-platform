name: skillpulse

services:
  database:
    image: postgres:16-alpine
    container_name: skillpulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillpulse}
      POSTGRES_USER: ${POSTGRES_USER:-skillpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillpulse_local_only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - skillpulse_postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-skillpulse} -d ${POSTGRES_DB:-skillpulse}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  skillpulse_postgres_data:
